<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clavarium Tether</title>
    <style>
        :root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1b; --muted: #6b6b66; --line: #e3e3de; --accent: #2f6f4f; --warn: #b4552d; --wait: #c08a1e; }
        @media (prefers-color-scheme: dark) { :root { --bg: #22221f; --fg: #ecece6; --muted: #a3a39b; --line: #34342f; --accent: #6fbf8f; --warn: #e08a5f; --wait: #d9b45a; } }
        html, body { background: var(--bg); color: var(--fg); }
        body { font: 14px/1.45 system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; box-sizing: border-box; }
        button, input { font: inherit; }
        .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .head b { font-size: 14px; white-space: nowrap; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
        .dot.on { background: var(--accent); }
        .dot.wait { background: var(--wait); }
        .state { color: var(--muted); font-size: 12px; margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        label.big { display: block; font-size: 13px; margin-bottom: 6px; }
        .row { display: flex; gap: 6px; }
        input[type=text] { flex: 1; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
        button.main { padding: 7px 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
        @media (prefers-color-scheme: dark) { button.main { color: #10241a; } }
        .said { color: var(--muted); font-size: 12px; margin-top: 6px; min-height: 1em; }
        .sub { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
        .tab { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
        .tab .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tab .s { grid-column: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tab .more { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
        .tab .more input { margin: 0; accent-color: var(--accent); }
        .tab.all .t { font-weight: 600; }
        .tab.all .s { white-space: normal; }
        .sw { grid-row: 1 / span 2; grid-column: 2; position: relative; width: 38px; height: 22px; }
        .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
        .sw span { position: absolute; inset: 0; background: var(--line); border-radius: 22px; transition: .15s; cursor: pointer; }
        .sw span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
        .sw input:checked + span { background: var(--accent); }
        .sw input:checked + span::after { transform: translateX(16px); }
        .sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
        .empty { color: var(--muted); font-size: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
        .foot { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
        .foot button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font-size: 12px; }
        .foot button.sure { color: #fff; background: var(--warn); text-decoration: none; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="head"><span class="dot" id="dot"></span><b>Clavarium Tether</b><span class="state" id="state"></span></div>
    <div id="pasteBox" hidden>
        <label class="big" for="config" data-i18n="pasteLabel"></label>
        <div class="row"><input type="text" id="config" autocomplete="off" spellcheck="false"><button class="main" id="paste" data-i18n="pair"></button></div>
        <div class="said" id="pasteSaid"></div>
    </div>
    <div id="pairedBox" hidden>
        <div class="sub" data-i18n="scope"></div>
        <div id="tabs"></div>
        <div class="foot"><span id="count"></span><button id="unpair" type="button"></button></div>
    </div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
